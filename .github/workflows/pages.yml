name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - master
    paths:
      - "catalogues/virginie-prints-catalogue"
      - "catalogues/virginie-prints-catalogue/**"
      - "_config.yml"
      - "index.html"
      - "_layouts/**"
      - "_includes/**"
      - "_sass/**"
      - "assets/**"
      - "scripts/**"
      - "Rakefile"
      - "Gemfile"
      - "Gemfile.lock"
      - ".gitmodules"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Detect ImageMagick tool
        run: |
          if command -v magick >/dev/null 2>&1; then
            echo "Using ImageMagick entrypoint: magick"
            magick -version | head -n 1
          elif command -v convert >/dev/null 2>&1; then
            echo "Using ImageMagick entrypoint: convert"
            convert -version | head -n 1
          else
            echo "ImageMagick missing, installing..."
            sudo apt-get update
            sudo apt-get install -y imagemagick

            if command -v magick >/dev/null 2>&1; then
              echo "Using ImageMagick entrypoint: magick"
              magick -version | head -n 1
            elif command -v convert >/dev/null 2>&1; then
              echo "Using ImageMagick entrypoint: convert"
              convert -version | head -n 1
            else
              echo "No ImageMagick binary found after install (expected 'magick' or 'convert')."
              exit 1
            fi
          fi

      - name: Build site
        run: bundle exec rake build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
