<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <img
            class="brand-logo"
            src="{{ '/assets/logo/cat-logo-transparent.png' | relative_url }}"
            alt="Virginie Prints cat logo"
            width="84"
            height="72"
          />
          <div class="brand-copy">
            <h1 class="site-title">{{ page.header_title | default: site.title }}</h1>
            <p class="eyebrow"><b>Prints Catalogue.</b> Original works and limited series. All sizes and techniques listed.</p>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      {{ content }}
    </main>
  </body>
</html>
